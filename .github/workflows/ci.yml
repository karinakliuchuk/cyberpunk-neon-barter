name: Build and Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restore dependencies
      run: dotnet restore CyberpunkNeonBarter.sln

    - name: Build
      run: dotnet restore CyberpunkNeonBarter.sln

    - name: Test
      run: dotnet test CyberpunkNeonBarter.sln --no-build --verbosity normal
