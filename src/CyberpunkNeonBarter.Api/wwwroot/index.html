<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Neon Barter</title>
    <style>
        body { background-color: #0d0d0d; color: #00ffcc; font-family: 'Courier New', monospace; padding: 20px; }
        h1 { text-align: center; text-shadow: 0 0 10px #00ffcc; }
        .container { max-width: 600px; margin: 0 auto; }
        .panel { background: #1a1a1a; border: 2px solid #ff00ff; padding: 20px; border-radius: 8px; box-shadow: 0 0 15px #ff00ff; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #000; color: #00ffcc; border: 1px solid #00ffcc; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; text-transform: uppercase; background: #00ffcc; color: #000; transition: 0.3s; }
        button:hover { background: #ff00ff; color: #fff; box-shadow: 0 0 10px #ff00ff; }
        pre { background: #000; padding: 10px; border: 1px solid #333; overflow-x: auto; font-size: 12px; color: #fff; }
        .hidden { display: none; }
        .status { text-align: center; margin-bottom: 20px; color: #ff00ff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>CYBERPUNK NEON BARTER</h1>
    <div class="status" id="statusMessage">Статус: Не авторизовано</div>

    <div class="container">
        <!-- Екран 1: Авторизація -->
        <div class="panel" id="loginPanel">
            <h3>Вхід у систему</h3>
            <p>Натисніть кнопку, щоб згенерувати JWT-токен та увійти.</p>
            <button onclick="login()">Увійти як тестовий користувач</button>
        </div>

        <!-- Екран 2: Створення оголошення (приховано за замовчуванням) -->
        <div class="panel hidden" id="createPanel">
            <h3>Створити оголошення</h3>
            
            <label>Тип:</label>
            <select id="type">
                <option value="0">Give (Віддаю)</option>
                <option value="1">Need (Потребую)</option>
            </select>
            
            <label>Категорія:</label>
            <select id="category">
                <option value="0">Вода (Water)</option>
                <option value="1">Їжа (Food)</option>
                <option value="2">Ліки (Medicine)</option>
                <option value="3">Зв'язок (Communication)</option>
                <option value="4">Енергія (Energy)</option>
                <option value="99">Інше (Other)</option> <!-- Нова категорія -->
            </select>

            <label>Кількість:</label>
            <input type="number" id="quantity" value="5" min="1" />

            <label>Опис:</label>
            <input type="text" id="description" value="Свіжий ресурс" />

            <button onclick="createOffer()">Створити</button>
            <pre id="result">Результат...</pre>
        </div>
    </div>

    <script>
        let authToken = null;
        const TEST_USER_ID = "3fa85f64-5717-4562-b3fc-2c963f66afa6";

        async function login() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: TEST_USER_ID, role: 'Participant' })
                });
                
                if (!response.ok) throw new Error('Помилка сервера');
                
                const data = await response.json();
                authToken = data.token;
                
                // Змінюємо UI
                document.getElementById('loginPanel').classList.add('hidden');
                document.getElementById('createPanel').classList.remove('hidden');
                document.getElementById('statusMessage').innerText = "Статус: Авторизовано (Participant)";
            } catch (e) {
                alert("Помилка входу: " + e.message);
            }
        }

        async function createOffer() {
            if (!authToken) return alert('Спочатку увійдіть!');

            const data = {
                userId: TEST_USER_ID,
                type: parseInt(document.getElementById('type').value),
                category: parseInt(document.getElementById('category').value),
                quantity: parseInt(document.getElementById('quantity').value),
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/api/offers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(data)
                });
                
                // Обробка статусів
                if (response.status === 201 || response.status === 200) {
                    const result = await response.json();
                    document.getElementById('result').innerText = JSON.stringify(result, null, 2);
                    document.getElementById('result').style.color = "#00ffcc";
                } else if (response.status === 401) {
                    document.getElementById('result').innerText = "Помилка 401: Токен недійсний або прострочений.";
                    document.getElementById('result').style.color = "#ff0000";
                } else {
                    // Інші помилки (наприклад, 400 через неправильну категорію)
                    const text = await response.text();
                    document.getElementById('result').innerText = `Помилка ${response.status}: ${text}`;
                    document.getElementById('result').style.color = "#ff0000";
                }
            } catch (e) {
                document.getElementById('result').innerText = "Помилка з'єднання: " + e.message;
                document.getElementById('result').style.color = "#ff0000";
            }
        }
    </script>
</body>
</html>
