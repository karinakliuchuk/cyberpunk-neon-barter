<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Neon Barter</title>
    <style>
        body { background-color: #0d0d0d; color: #00ffcc; font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        h1 { text-align: center; text-shadow: 0 0 10px #00ffcc; margin-bottom: 5px; }
        .status { text-align: center; margin-bottom: 30px; color: #ff00ff; font-weight: bold; }
        
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        
        /* Панелі */
        .panel { display: none; background: #1a1a1a; border: 2px solid #ff00ff; padding: 30px; border-radius: 8px; box-shadow: 0 0 15px #ff00ff; width: 100%; box-sizing: border-box; text-align: center; }
        .panel.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        .panel-left { text-align: left; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Кнопки */
        button { cursor: pointer; font-weight: bold; text-transform: uppercase; background: #00ffcc; color: #000; transition: 0.3s; border: none; padding: 15px 20px; margin: 10px 0; font-size: 16px; width: 100%; border-radius: 4px; }
        button:hover { background: #ff00ff; color: #fff; box-shadow: 0 0 10px #ff00ff; }
        
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .btn-back { background: #333; color: #00ffcc; margin-top: 20px; }
        .btn-back:hover { background: #555; box-shadow: none; }
        .btn-small { width: auto; padding: 10px 20px; font-size: 14px; }

        /* Форми */
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #000; color: #00ffcc; border: 1px solid #00ffcc; box-sizing: border-box; }
        label { display: block; text-align: left; margin-top: 10px; color: #ff00ff; }

        /* Таблиця */
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 15px; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #333; }
        th { color: #ff00ff; font-weight: bold; }
        tr:hover { background: #222; }
        
        pre { background: #000; padding: 10px; border: 1px solid #333; overflow-x: auto; font-size: 12px; color: #fff; text-align: left; }
    </style>
</head>
<body>
    <h1>CYBERPUNK NEON BARTER</h1>
    <div class="status" id="statusMessage">Статус: Не авторизовано</div>

    <div class="container">
        <!-- Екран 0: Вітання (початковий) -->
        <div class="panel active" id="welcomePanel">
            <h2>Ласкаво просимо до системи обміну</h2>
            <div class="btn-group">
                <button onclick="showPanel('loginPanel')">Увійти в систему</button>
            </div>
        </div>

        <!-- Екран 1: Авторизація -->
        <div class="panel" id="loginPanel">
            <h3>Вхід</h3>
            <p>Натисніть кнопку, щоб згенерувати JWT-токен та увійти.</p>
            <button onclick="login()">Увійти як тестовий користувач</button>
            <button class="btn-back" onclick="showPanel('welcomePanel')">← Назад</button>
        </div>

        <!-- Екран 2: Головне меню -->
        <div class="panel" id="mainMenuPanel">
            <h3>Головне меню</h3>
            <div class="btn-group">
                <button onclick="showPanel('createPanel')">Створити оголошення</button>
                <button onclick="showPanel('listPanel'); loadOffers();">Переглянути всі оголошення</button>
                <button class="btn-back" onclick="logout()">Вийти з акаунта</button>
            </div>
        </div>

        <!-- Екран 3: Створення оголошення -->
        <div class="panel panel-left" id="createPanel">
            <h3 style="text-align: center;">Створити оголошення</h3>
            
            <label>Тип:</label>
            <select id="type">
                <option value="0">Give (Віддаю)</option>
                <option value="1">Need (Потребую)</option>
            </select>
            
            <label>Категорія:</label>
            <select id="category">
                <option value="0">Вода (Water)</option>
                <option value="1">Їжа (Food)</option>
                <option value="2">Ліки (Medicine)</option>
                <option value="3">Зв'язок (Communication)</option>
                <option value="4">Енергія (Energy)</option>
                <option value="99">Інше (Other)</option>
            </select>

            <label>Кількість:</label>
            <input type="number" id="quantity" value="5" min="1" />

            <label>Опис:</label>
            <input type="text" id="description" value="Свіжий ресурс" />

            <button onclick="createOffer()">Створити</button>
            <pre id="result" class="hidden">Результат...</pre>
            
            <button class="btn-back" onclick="showPanel('mainMenuPanel')">← Назад до меню</button>
        </div>

        <!-- Екран 4: Список оголошень -->
        <div class="panel" id="listPanel">
            <h3>Всі оголошення в базі</h3>
            <div id="offersList">
                <p>Завантаження...</p>
            </div>
            
            <button class="btn-back" onclick="showPanel('mainMenuPanel')">← Назад до меню</button>
        </div>
    </div>

    <script>
        let authToken = null;
        const TEST_USER_ID = "3fa85f64-5717-4562-b3fc-2c963f66afa6";

        // Функція для перемикання екранів
        function showPanel(panelId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
        }

        async function login() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: TEST_USER_ID, role: 'Participant' })
                });
                
                if (!response.ok) throw new Error('Помилка сервера');
                
                const data = await response.json();
                authToken = data.token;
                
                document.getElementById('statusMessage').innerText = "Статус: Авторизовано (Participant)";
                showPanel('mainMenuPanel');
            } catch (e) {
                alert("Помилка входу: " + e.message);
            }
        }

        function logout() {
            authToken = null;
            document.getElementById('statusMessage').innerText = "Статус: Не авторизовано";
            showPanel('welcomePanel');
        }

        async function createOffer() {
            if (!authToken) return alert('Спочатку увійдіть!');

            const resultBox = document.getElementById('result');
            resultBox.classList.remove('hidden');
            resultBox.innerText = "Відправка...";

            const data = {
                userId: TEST_USER_ID,
                type: parseInt(document.getElementById('type').value),
                category: parseInt(document.getElementById('category').value),
                quantity: parseInt(document.getElementById('quantity').value),
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/api/offers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.status === 201 || response.status === 200) {
                    const result = await response.json();
                    resultBox.innerText = JSON.stringify(result, null, 2);
                    resultBox.style.color = "#00ffcc";
                } else {
                    const text = await response.text();
                    resultBox.innerText = `Помилка ${response.status}: ${text}`;
                    resultBox.style.color = "#ff0000";
                }
            } catch (e) {
                resultBox.innerText = "Помилка з'єднання: " + e.message;
                resultBox.style.color = "#ff0000";
            }
        }

        async function loadOffers() {
            if (!authToken) return;
            const listContainer = document.getElementById('offersList');
            listContainer.innerHTML = "<p>Завантаження...</p>";

            try {
                const response = await fetch('/api/offers', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (!response.ok) throw new Error('Помилка завантаження');
                
                let offers = await response.json();
                
                if (offers.length === 0) {
                    listContainer.innerHTML = "<p>Оголошень поки немає.</p>";
                    return;
                }

                // СОРТУВАННЯ: найновіші зверху
                offers.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                let html = "<table>";
                html += "<tr><th>Дата</th><th>Тип</th><th>Категорія</th><th>К-сть</th><th>Статус</th></tr>";
                
                offers.forEach(o => {
                    // Форматуємо дату для краси
                    const date = new Date(o.createdAt).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    html += `<tr>
                        <td>${date}</td>
                        <td>${o.type}</td>
                        <td>${o.category}</td>
                        <td>${o.quantity}</td>
                        <td style="color: ${o.status === 'Active' ? '#00ffcc' : '#ff0000'}">${o.status}</td>
                    </tr>`;
                });
                html += "</table>";
                
                listContainer.innerHTML = html;
            } catch (e) {
                listContainer.innerHTML = `<p style="color: #ff0000;">Помилка: ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
