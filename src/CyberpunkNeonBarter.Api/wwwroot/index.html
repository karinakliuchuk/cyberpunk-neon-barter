<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Neon Barter</title>
    <style>
        body { background-color: #0d0d0d; color: #00ffcc; font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        h1 { text-align: center; text-shadow: 0 0 10px #00ffcc; margin-bottom: 5px; }
        .status { text-align: center; margin-bottom: 30px; color: #ff00ff; font-weight: bold; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        
        .panel { display: none; background: #1a1a1a; border: 2px solid #ff00ff; padding: 30px; border-radius: 8px; box-shadow: 0 0 15px #ff00ff; width: 100%; box-sizing: border-box; text-align: center; }
        .panel.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        .panel-left { text-align: left; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        button { cursor: pointer; font-weight: bold; text-transform: uppercase; background: #00ffcc; color: #000; transition: 0.3s; border: none; padding: 15px 20px; margin: 10px 0; font-size: 16px; width: 100%; border-radius: 4px; }
        button:hover { background: #ff00ff; color: #fff; box-shadow: 0 0 10px #ff00ff; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .btn-back { background: #333; color: #00ffcc; margin-top: 20px; }
        .btn-back:hover { background: #555; box-shadow: none; }
        .btn-action { background: #ff00ff; color: #fff; }

        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; background: #000; color: #00ffcc; border: 1px solid #00ffcc; box-sizing: border-box; }
        label { display: block; text-align: left; margin-top: 10px; color: #ff00ff; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 15px; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #333; }
        th { color: #ff00ff; font-weight: bold; }
        tr:hover { background: #222; }
        pre { background: #000; padding: 10px; border: 1px solid #333; overflow-x: auto; font-size: 12px; color: #fff; text-align: left; }
        input[type="date"] { color-scheme: dark; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        
        /* Приховуємо елементи для гостей */
        .auth-only { display: none; }
    </style>
</head>
<body>
    <h1>CYBERPUNK NEON BARTER</h1>
    <div class="status" id="statusMessage">Статус: Не авторизовано</div>

    <div class="container">
        <!-- Екран 0: Вітання -->
        <div class="panel active" id="welcomePanel">
            <h2>Ласкаво просимо до системи обміну</h2>
            <div class="btn-group">
                <button onclick="showPanel('loginPanel')">Увійти в систему</button>
            </div>
        </div>

        <!-- Екран 1: Авторизація та Реєстрація -->
        <div class="panel" id="loginPanel">
            <h3>Вхід / Реєстрація</h3>
            <label>Логін (Username):</label>
            <input type="text" id="authUsername" placeholder="Введіть логін" />
            <label>Пароль:</label>
            <input type="password" id="authPassword" placeholder="Введіть пароль" />
            <div class="btn-group">
                <button onclick="login()">Увійти</button>
                <button onclick="register()" class="btn-action">Зареєструватися</button>
            </div>
            <button class="btn-back" onclick="showPanel('welcomePanel')">← Назад</button>
        </div>

        <!-- Екран 2: Головне меню -->
        <div class="panel" id="mainMenuPanel">
            <h3>Головне меню</h3>
            <div class="btn-group">
                <!-- Кнопки створення та профілю доступні лише авторизованим -->
                <button class="auth-only" onclick="showPanel('createPanel')">Створити оголошення</button>
                <button class="auth-only" onclick="showPanel('myProfilePanel'); loadMyOffers();">Мій профіль (Мої оголошення)</button>
                <button class="auth-only btn-action" onclick="findCycle()">Знайти цикл обміну</button>
                
                <button onclick="showPanel('listPanel'); loadOffers();">Переглянути всі оголошення</button>
                <button class="btn-back" onclick="logout()">Вийти з акаунта</button>
            </div>
        </div>

        <!-- Екран 3: Створення оголошення -->
        <div class="panel panel-left" id="createPanel">
            <h3 style="text-align: center;">Створити оголошення</h3>
            <label>Тип:</label>
            <select id="type">
                <option value="0">Give (Віддаю)</option>
                <option value="1">Need (Потребую)</option>
            </select>
            <label>Категорія:</label>
            <select id="category">
                <option value="0">Вода (Water)</option>
                <option value="1">Їжа (Food)</option>
                <option value="2">Ліки (Medicine)</option>
                <option value="3">Зв'язок (Communication)</option>
                <option value="4">Енергія (Energy)</option>
                <option value="99">Інше (Other)</option>
            </select>
            <label>Кількість:</label>
            <input type="number" id="quantity" value="5" min="1" />
            <label>Опис:</label>
            <input type="text" id="description" value="Свіжий ресурс" />
            <label>Термін дії (ExpiresAt):</label>
            <input type="date" id="expiresAt" />

            <button onclick="createOffer()">Створити</button>
            <pre id="result" class="hidden">Результат...</pre>
            <button class="btn-back" onclick="showPanel('mainMenuPanel')">← Назад до меню</button>
        </div>

        <!-- Екран 4: Список всіх оголошень -->
        <div class="panel" id="listPanel">
            <h3>Всі оголошення в базі</h3>
            <label style="color: #00ffcc; font-weight: bold;">Фільтр за категорією:</label>
            <select id="filterCategory" onchange="loadOffers()">
                <option value="-1">Всі категорії</option>
                <option value="0">Вода (Water)</option>
                <option value="1">Їжа (Food)</option>
                <option value="2">Ліки (Medicine)</option>
                <option value="3">Зв'язок (Communication)</option>
                <option value="4">Енергія (Energy)</option>
                <option value="99">Інше (Other)</option>
            </select>
            <div id="offersList"><p>Завантаження...</p></div>
            <button class="btn-back" onclick="showPanel('mainMenuPanel')">← Назад до меню</button>
        </div>

        <!-- Екран 5: Мій профіль -->
        <div class="panel" id="myProfilePanel">
            <h3>Мої оголошення</h3>
            <div id="myOffersList"><p>Завантаження...</p></div>
            <button class="btn-back" onclick="showPanel('mainMenuPanel')">← Назад до меню</button>
        </div>
    </div>

    <script src="js/api-client.js?v=5"></script>
    <script>
        function updateUIForAuth() {
            const statusMsg = document.getElementById('statusMessage');
            const authElements = document.querySelectorAll('.auth-only');
            
            if (apiClient.token) {
                statusMsg.innerText = "Статус: Авторизовано";
                authElements.forEach(el => el.style.display = 'block');
                showPanel('mainMenuPanel');
            } else {
                statusMsg.innerText = "Статус: Не авторизовано";
                authElements.forEach(el => el.style.display = 'none');
                showPanel('welcomePanel');
            }
        }

        // Перевіряємо стан при завантаженні сторінки
        window.onload = updateUIForAuth;

        function showPanel(panelId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
        }

        async function register() {
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;
            if (!username || !password) return alert("Введіть логін та пароль!");

            try {
                await apiClient.register(username, password);
                alert("Реєстрація успішна! Тепер увійдіть.");
                await login();
            } catch (e) {
                alert("Помилка реєстрації: " + e.message);
            }
        }

        async function login() {
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;
            if (!username || !password) return alert("Введіть логін та пароль!");

            try {
                await apiClient.login(username, password);
                updateUIForAuth();
            } catch (e) {
                alert("Помилка входу: " + e.message);
            }
        }

        function logout() {
            apiClient.logout();
            updateUIForAuth();
        }

        async function createOffer() {
            const resultBox = document.getElementById('result');
            resultBox.classList.remove('hidden');
            resultBox.innerText = "Відправка...";

            const dateInput = document.getElementById('expiresAt').value;
            const expiresAtIso = dateInput ? new Date(dateInput).toISOString() : null;

            const data = {
                type: parseInt(document.getElementById('type').value),
                category: parseInt(document.getElementById('category').value),
                quantity: parseInt(document.getElementById('quantity').value),
                description: document.getElementById('description').value,
                expiresAt: expiresAtIso
            };

            try {
                const response = await apiClient.createOffer(data);
                if (response.ok) {
                    resultBox.innerText = JSON.stringify(response.data, null, 2);
                    resultBox.style.color = "#00ffcc";
                } else {
                    resultBox.innerText = `Помилка ${response.status}: ${response.text}`;
                    resultBox.style.color = "#ff0000";
                }
            } catch (e) {
                resultBox.innerText = "Помилка: " + e.message;
                resultBox.style.color = "#ff0000";
            }
        }

        async function loadOffers() {
            if (!apiClient.token) return;
            const listContainer = document.getElementById('offersList');
            listContainer.innerHTML = "<p>Завантаження...</p>";

            try {
                let offers = await apiClient.getOffers();
                const selectedCategory = parseInt(document.getElementById('filterCategory').value);
                if (selectedCategory !== -1) {
                    offers = offers.filter(o => o.category === getCategoryName(selectedCategory));
                }
                
                if (offers.length === 0) {
                    listContainer.innerHTML = "<p>Оголошень поки немає.</p>";
                    return;
                }
                offers.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                let html = "<table>";
                html += "<tr><th>Дата</th><th>Тип</th><th>Категорія</th><th>К-сть</th><th>Опис</th><th>Термін дії</th><th>Статус</th></tr>";
                offers.forEach(o => {
                    const date = new Date(o.createdAt).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    const expDate = o.expiresAt ? new Date(o.expiresAt).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
                    html += `<tr><td>${date}</td><td>${o.type}</td><td>${o.category}</td><td>${o.quantity}</td><td>${o.description || '-'}</td><td>${expDate}</td><td style="color: ${o.status === 'Active' ? '#00ffcc' : '#ff0000'}">${o.status}</td></tr>`;
                });
                html += "</table>";
                listContainer.innerHTML = html;
            } catch (e) {
                listContainer.innerHTML = `<p style="color: #ff0000;">Помилка: ${e.message}</p>`;
            }
        }

        async function loadMyOffers() {
            if (!apiClient.token) return;
            const listContainer = document.getElementById('myOffersList');
            listContainer.innerHTML = "<p>Завантаження...</p>";

            try {
                let offers = await apiClient.getMyOffers();
                if (offers.length === 0) {
                    listContainer.innerHTML = "<p>У вас ще немає оголошень.</p>";
                    return;
                }
                
                let html = "<table>";
                html += "<tr><th>Тип</th><th>Категорія</th><th>К-сть</th><th>Опис</th><th>Статус</th></tr>";
                offers.forEach(o => {
                    html += `<tr><td>${o.type}</td><td>${o.category}</td><td>${o.quantity}</td><td>${o.description || '-'}</td><td style="color: ${o.status === 'Active' ? '#00ffcc' : '#ff0000'}">${o.status}</td></tr>`;
                });
                html += "</table>";
                listContainer.innerHTML = html;
            } catch (e) {
                listContainer.innerHTML = `<p style="color: #ff0000;">Помилка: ${e.message}</p>`;
            }
        }

        async function findCycle() {
            try {
                const result = await apiClient.findCycle();
                alert("Успіх! Цикл знайдено та створено угоду.\nID угоди: " + result.dealId + "\nСтатус: " + result.status);
            } catch (e) {
                alert("Увага: " + e.message);
            }
        }

        function getCategoryName(id) {
            const categories = {0: 'Water', 1: 'Food', 2: 'Medicine', 3: 'Communication', 4: 'Energy', 99: 'Other'};
            return categories[id] || '';
        }
    </script>
</body>
</html>
